# Backend configuration.
# Format: name|kind|model_light|model_strong|extra|enabled(on|off)
#   kind:
#     deepseek     -> extra unused (write: -); key from env DEEPSEEK_API_KEY
#     antigravity  -> extra = agy --print-timeout in seconds; no key needed (the CLI keeps its own login)
#     anthropic    -> extra = base_url (Anthropic-compatible); key from env ORCH_<NAME>_API_KEY
#     openai       -> extra = base_url (OpenAI-compatible chat/completions); key from env ORCH_<NAME>_API_KEY
deepseek|deepseek|ds-model-fast|ds-model-fast|-|on
antigravity|antigravity|ag-model-fast-medium|ag-model-strong-medium|600|on
# Example: third API (Anthropic-compatible). Add with: orchestrate.sh add-api myapi anthropic <base_url> <mlight> <mstrong>
# myapi|anthropic|model-small|model-large|https://api.example.com/anthropic|off
# Example: OpenAI-compatible API. Add with: orchestrate.sh add-api myopenai openai <base_url> <mlight> <mstrong>
# myopenai|openai|model-small|model-large|https://api.example.com/v1|off
