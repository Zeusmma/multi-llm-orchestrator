# Routing table: difficulty tier -> model chain (left to right; the first usable one wins).
# Format: tier|spec|spec|...
#   spec = <alias>:<model>[@offpeak]
#     ag = antigravity backend, ds = deepseek backend, gm = gemini (openai-kind) backend
#     a full backend name also works (e.g. antigravity:ag-model-strong-low)
#   @offpeak = only used outside the provider's peak hours
#              (PEAK_TZ, default UTC, Mon-Fri 09:00-12:00 and 14:00-18:00); during peak the next item is used.
#   gm:* is disabled by default: there is no "gemini" backend in backends.conf.
#
# Policy: free quota first (Antigravity), then paid DeepSeek Flash (low -> high -> max).
#   A disabled backend (orchestrate.sh disable) is skipped automatically.
#   %effort = DeepSeek effort (low|high|max). For Antigravity the effort is the model name suffix (low/medium/high).
#   Expensive tiers (strong-high, max-high) are capped at a few runs per day in limits.conf.
light|ag:ag-model-fast-low|ag:ag-model-fast-medium|ds:ds-model-fast%low
medium|ag:ag-model-fast-medium|ag:ag-model-fast-high|ag:ag-model-strong-low|ds:ds-model-fast%low
strong|ag:ag-model-strong-low|ag:ag-model-strong-medium|ag:ag-model-fast-high|ds:ds-model-fast%low
critical|ag:ag-model-strong-medium|ag:ag-model-strong-high|ds:ds-model-fast%low
